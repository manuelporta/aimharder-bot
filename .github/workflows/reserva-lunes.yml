name: MondayBooking

on:
  schedule:
    # GitHub Actions cron times are ALWAYS UTC.
    - cron: "01 19 * 1,2,11,12 FRI"      # Winter (Nov-Feb): 20:00 CET
    - cron: "01 18 * 3-10 FRI"           # Summer (Mar-Oct): 20:00 CEST
  workflow_dispatch:              # Manual trigger

permissions:
  contents: read

jobs:
  book:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run booking script
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          BOX_NAME: ${{ secrets.BOX_NAME }}
          BOX_ID: ${{ secrets.BOX_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Target class start time in Madrid local time (not UTC).
          TARGET_HOUR: 20
          TARGET_MINUTE: 00

        run: |
          echo "🚀 Reservando clase..."
          python main.py --days-ahead 3
